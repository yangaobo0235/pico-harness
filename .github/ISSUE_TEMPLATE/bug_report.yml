name: Bug report
description: Report a reproducible problem
body:
  - type: input
    id: environment
    attributes:
      label: Environment and version
      description: OS, Pico, Python and Node versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, personal data and private addresses
