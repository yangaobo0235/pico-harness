name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check src scripts tests examples
      - run: uv run ruff format --check src scripts tests examples
      - run: uv run python -m scripts.ci.check_architecture
      - run: uv run pytest tests -n 4 -q --strict-markers
      - run: uv build
  pull-request-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python scripts/ci/check_pr_title.py
