name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/tui/package-lock.json
      - run: uv sync --frozen --extra dev --extra channels
      - run: npm ci
      - run: npm ci --prefix apps/tui
      - run: uv run ruff check src scripts tests benchmarks hatch_build.py
      - run: uv run ruff format --check src scripts tests benchmarks hatch_build.py
      - run: uv run python -m scripts.ci.check_architecture
      - run: uv run python -m scripts.ci.check_repository
      - run: uv run python -m scripts.ci.check_docs
      - run: npm --prefix apps/tui run lint
      - run: npm --prefix apps/tui run lint:rpc
      - run: npm --prefix apps/tui run lint:rpc-surface
      - run: npm run typecheck:tui
      - run: npm run build:tui
      - run: uv run pytest tests -n 4 -q --strict-markers
      - run: npm run test:tui
      - run: uv build
  pull-request-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: uv run python -m scripts.ci.check_pr_title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
