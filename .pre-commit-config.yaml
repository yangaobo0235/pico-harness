repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: conventional-commit-message
        name: conventional commit message
        entry: uv run python -m scripts.ci.check_commit_file
        language: system
        stages: [commit-msg]
      - id: eslint-tui
        name: eslint (TUI)
        entry: npm --prefix apps/tui run lint
        language: system
        pass_filenames: false
        files: '^apps/tui/(src|tests)/.*\.(ts|tsx)$'
      - id: architecture
        name: Python module boundaries
        entry: uv run python -m scripts.ci.check_architecture
        language: system
        pass_filenames: false
        files: '^src/pico/.*\.py$'
