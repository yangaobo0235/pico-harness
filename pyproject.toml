[project]
name = "pico-harness"
version = "0.1.7"
description = "Compact, composable, benchmark-gated Agent Harness with an opt-in evolution path"
requires-python = ">=3.12,<3.13"
license =  "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*", "NOTICES.md"]
authors = [
    {name = "Hackerismydream"}
]
keywords = ["ai", "agent", "cli", "terminal", "context-management", "skill-evolution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "litellm>=1.82.1,<1.92.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "croniter>=6.0.0,<7.0.0",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0.0",
    "json-repair>=0.30.0",
    # Token 估算是运行时直接提供的功能，应与供应商碰巧安装的分词器依赖保持独立。
    "tiktoken>=0.7.0,<1.0.0",
    "questionary>=2.0.0,<3.0.0",
    "watchfiles>=0.21,<2.0",
    "tomli-w>=1.2.0",
    # OAuth 供应商登录（Codex/GitHub Copilot）会在引导期间导入此包，因此它必须是
    # 运行时依赖；否则通过 `uv tool install pico-harness` 安装的用户一选择 OAuth
    # 供应商就会遇到“oauth_cli_kit not installed”。
    "oauth-cli-kit>=0.1.6,<1.0.0",
    "portalocker>=3.2.0",
    "mcp>=1.27.0",
    "orjson>=3.11.6,<4.0",
    # KNN 模型路由器（routing/knn_router.py）的嵌入 KNN。目前它也是经 lancedb
    # 引入的传递依赖；直接固定可确保上游未来移除后路由仍能工作。
    "numpy>=2.0,<3.0",
    "pillow>=12.3,<13.0",
    "packaging>=24.0,<26.0",
]

[project.optional-dependencies]
channel-feishu = ["lark-oapi>=1.5.0,<2.0.0"]
channel-wecom = ["wecom-aibot-sdk-python>=0.1.5"]
channel-qq = ["qq-botpy>=1.2.0,<2.0.0"]
channels = [
    "pico-harness[channel-feishu,channel-qq,channel-wecom]",
]
tools = [
    "readability-lxml>=0.8.4,<1.0.0",
    "oauth-cli-kit>=0.1.6,<1.0.0",
]
retrieval = [
    "torch>=2.0.0",
    "transformers>=4.45.0",
]
sandbox = [
    "boxlite==0.9.5",
    "anyio>=4.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
eval = []

[project.scripts]
pico = "pico.interfaces.cli.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pico"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/", "apps/", "scripts/install/", "hatch_build.py",
    "pyproject.toml", "uv.lock", "README.md", "LICENSE", "LICENSES/", "NOTICES.md",
]

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.13.4",
    "pip>=26.1.2",
    "pyjwt>=2.13.0",
    "python-engineio>=4.13.3",
    "python-dotenv>=1.2.2",
    "starlette>=1.3.1",
]

[tool.uv.sources]
pico-harness = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["benchmarks/**/data", "benchmarks/**/results", "benchmarks/**/output"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "S101", "S105", "S106", "S107", "S506", "S605", "S607"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 测试约定：允许断言、夹具凭据、测试命名、Fixture 重定义与延迟导入。
# 测试和产品代码都执行导入排序与格式检查。
"tests/**" = ["E402", "E741", "F811", "F841", "N802", "N805", "N806", "N817", "N818", "S101", "S105", "S106", "S107", "S607"]

# 追踪探针工厂以目标类为参数，并为可读性沿用类名，例如
# `def _install_llm(LLMProvider: type)`。
"src/pico/observability/tracing/instrument.py" = ["N803"]

# CLI 启动顺序与延迟导入，长期接受。
"src/pico/interfaces/cli/app.py" = ["E402"]
"src/pico/interfaces/cli/commands/cron.py" = ["E402"]

# 其他延迟导入或启动顺序导入，允许使用。
"src/pico/extensions/evaluation/engine.py" = ["E402"]
"src/pico/capabilities/skills/local/registry.py" = ["E402"]
"scripts/dev/skill_retrieval_full_e2e.py" = ["E402"]

# 这些模块保留用于校验内部不变量的断言。
"src/pico/runtime/subagents/manager.py" = ["S101"]
"src/pico/interfaces/cli/commands/doctor.py" = ["S101"]
"src/pico/interfaces/cli/onboarding/wizard.py" = ["S101"]
"src/pico/capabilities/memory/contract_test.py" = ["S101"]

# scripts/：开发工具，允许使用部分路径子进程和断言。
"scripts/ci/check_commit_file.py" = ["S607"]
"scripts/ci/check_commit_messages.py" = ["S607"]
"scripts/ci/check_large_files.py" = ["S607"]

# evolver 与 appworld 基准按设计使用 Git/Bash 子进程驱动（S607）；K 是 SOP 领域中
# 每任务试验次数的术语（N803/N806）；*_PASS/*_TOKEN 常量是结果标签和信标标记，
# 不是凭据（S105）；断言与上方转换或保留批次一起跟踪（S101）。
"src/pico/extensions/evolution/tree/git_ops.py" = ["S607"]
"src/pico/extensions/evolution/launch/config.py" = ["S607"]
"src/pico/extensions/evolution/launch/contract.py" = ["S607"]
"src/pico/extensions/evolution/launch/runner.py" = ["S607"]
"src/pico/extensions/evolution/orchestrator/nodes/semantic.py" = ["S101"]
"src/pico/extensions/evolution/scheduler/cold_start_bandit.py" = ["N803", "N806"]
"src/pico/extensions/evolution/scheduler/tree_aware_bandit.py" = ["N803"]
"src/pico/extensions/evolution/scheduler/tree_loader.py" = ["S101"]
"src/pico/extensions/evolution/analysis/stability_bucket.py" = ["S105"]
"src/pico/extensions/evolution/applier/beacon_guard.py" = ["S105"]
"src/pico/extensions/evolution/judge/prompts.py" = ["S105"]
"benchmarks/appworld/evolve/adapter.py" = ["N803", "S105"]
"benchmarks/appworld/evolve/editor.py" = ["N806"]
"benchmarks/appworld/evolve/sandbox.py" = ["S607"]

# benchmarks/：评测框架，允许相应命名、含糊名称、未使用变量和部分路径子进程。
"benchmarks/clawbench/stream.py" = ["S607"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 120
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "-m",
    "not (real_llm or llm_judge or real_vm or real_channel or external_runtime or e2e or performance)",
]
markers = [
    "performance: timing-sensitive experiments; run separately without parallel workers",
    "real_llm: calls a live model or embedding endpoint and may incur cost; opt-in",
    "llm_judge: uses an LLM as a grader for extraction quality (extra cost / non-determinism); opt-in",
    "real_vm: boots or connects to a real virtual machine; opt-in",
    "real_channel: connects to an external messaging channel; opt-in",
    "external_runtime: requires a runtime or executable outside the Python test environment; opt-in",
    "e2e: spawns a real subprocess through the TUI autotest runtime; opt-in",
]

[dependency-groups]
dev = [
    "json-repair>=0.59.5",
    "oauth-cli-kit>=0.1.6",
    "pexpect>=4.9",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pyte>=0.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15.11,<0.16",
    "sqlmodel>=0.0.27,<1.0.0",
]
